[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosearch"
version = "0.3.0"
description = "Astronomical catalog crossmatching, time-domain, imaging, VO services and dataset generation engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # HTTP, API server and validation
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "PyJWT[crypto]>=2.9.0",
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "PyYAML>=6.0.0",
    # Science stack
    "numpy>=1.26",
    "scipy>=1.11",
    "astropy>=6.0.0",
    "pyerfa>=2.0.1",
    "astropy-healpix>=1.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "Pillow>=10.0",
    # Claude (ai.py: natural-language queries and explanations)
    "anthropic>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "respx>=0.21.0",
    "httpx-sse>=0.4.0",
    "pyvo>=1.5",
    "cdshealpix>=0.6",
    "matplotlib>=3.8",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
# SED plots (astrosearch sed --plot, sed.plot_sed)
plot = [
    "matplotlib>=3.8",
]
# Remote HATS catalogs (skycache.HatsRemoteProvider) and the HATS/lsdb compatibility tests
skycache-hats = [
    "lsdb>=0.11",
]
storage = [
    "psycopg[binary]>=3.2.0",
    "boto3>=1.35.0",
]
worker = [
    "rq>=2.0.0",
]

[project.scripts]
astrosearch = "main:main"

[tool.setuptools]
py-modules = [
    "models", "providers", "crossmatch", "astrometry", "streaming", "batch", "skycache", "vizier", "sed",
    "timedomain", "imaging", "ai", "provenance", "vo_server", "alerts", "datasets", "api", "main",
]

# The web UI (served at '/'). An editable install or a checkout serves web/ next to imaging.py;
# a wheel installs it under <prefix>/share/astrosearch/web, which api.py finds too
# (ASTROSEARCH_WEB_DIR overrides both).
[tool.setuptools.data-files]
"share/astrosearch/web" = ["web/index.html", "web/app.js", "web/styles.css"]

[tool.ruff]
line-length = 140

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: hits real public astronomy archives over the network (run with -m live)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources.*",
]
